<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Raven — Activity Log</title>
<link rel="stylesheet" href="/static/style.css?v=19">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">Raven</div>
    <nav>
      <a href="/">Today</a>
      <a href="/tasks">Tasks</a>
      <a href="/notes">Notes</a>
      <a href="/activity-log" class="active">Activity Log</a>
      <a href="/agents">Agents</a>
      <a href="/admin">Admin</a>
    </nav>
    <a href="/admin" class="sidebar-status" id="sidebar-status">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-label">Checking…</span>
    </a>
  </aside>
  <main class="main-content">
    <div class="container">
      <header>
        <h1>Activity Log</h1>
      </header>

      <div class="empty" style="margin-bottom: 16px;">
        Looking for a written report? See <a href="/agents">Agents</a> — "Weekly Status Report" and "Leadership Front-Burner Update" turn this into polished write-ups.
      </div>

      <section class="panel">
        <div class="row between">
          <h2>Raw Digest</h2>
          <button class="secondary" id="copy-raw-btn">Copy</button>
        </div>
        <div class="row" id="preset-filter" style="margin-bottom: 14px;">
          <button class="secondary preset-btn" data-days="7">7 Days</button>
          <button class="secondary preset-btn" data-days="14">14 Days</button>
          <button class="secondary preset-btn" data-days="30">30 Days</button>
        </div>
        <div id="report-output">
          <div class="empty">Pick a range above to build the digest.</div>
        </div>
      </section>
    </div>
  </main>
</div>

<script src="/static/status.js?v=1"></script>
<script src="/static/activity-log.js?v=1"></script>
</body>
</html>
