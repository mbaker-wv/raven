<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Raven — Tasks</title>
<link rel="stylesheet" href="/static/style.css?v=22">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="app-sidebar">
    <div class="sidebar-header">
      <div class="brand"><span class="brand-label">Raven</span></div>
      <button class="sidebar-toggle" id="sidebar-toggle" type="button" title="Collapse sidebar">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>
      </button>
    </div>
    <nav>
      <a href="/" title="Today"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2.6"/><path d="M8 1.6v1.6M8 12.8v1.6M2.6 8h1.6M11.8 8h1.6M4.3 4.3l1.1 1.1M10.6 10.6l1.1 1.1M11.7 4.3l-1.1 1.1M5.4 10.6l-1.1 1.1"/></svg><span>Today</span></a>
      <a href="/tasks" class="active" title="Tasks"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h11M2.5 8h11M2.5 12h7"/></svg><span>Tasks</span></a>
      <a href="/notes" title="Notes"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2.5h5l3 3v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-10a1 1 0 0 1 1-1z"/><path d="M9 2.5v3h3"/><path d="M5.3 8.5h5.4M5.3 11h5.4"/></svg><span>Notes</span></a>
      <a href="/activity-log" title="Activity Log"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.5h2.3l1.3-4 2 7 1.3-4.5 1 1.5H14"/></svg><span>Activity Log</span></a>
      <a href="/agents" title="Agents"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="10" height="7.5" rx="2"/><path d="M8 2.5v2.5"/><circle cx="8" cy="2" r="0.9" fill="currentColor" stroke="none"/><path d="M6 8.5v1M10 8.5v1"/><path d="M1.5 7.5v3M14.5 7.5v3"/></svg><span>Agents</span></a>
      <a href="/boards" title="Boards"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2.5" width="6" height="4" rx="1"/><rect x="8.5" y="9.5" width="6" height="4" rx="1"/><path d="M4.5 6.5v2a1 1 0 0 0 1 1H8m3 0V9.5"/></svg><span>Boards</span></a>
      <a href="/admin" title="Admin"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2.2"/><path d="M8 2.2v1.8M8 12v1.8M13.8 8h-1.8M4 8H2.2M12.1 3.9l-1.3 1.3M5.2 10.8L3.9 12.1M12.1 12.1l-1.3-1.3M5.2 5.2L3.9 3.9"/></svg><span>Admin</span></a>
    </nav>
    <a href="/admin" class="sidebar-status" id="sidebar-status">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-label">Checking…</span>
    </a>
  </aside>
  <main class="main-content">
    <div class="container">
      <header>
        <h1>Tasks</h1>
        <div class="row">
          <button id="open-add-task-btn">Add Tasks</button>
        </div>
      </header>

      <section class="panel" id="tasks-panel">
        <div class="row between">
          <h2>Tasks</h2>
        </div>
        <div class="row" style="margin-bottom: 10px;">
          <input type="text" id="task-search" placeholder="Search tasks..." style="flex: 1;">
        </div>
        <div class="row" id="view-toggle" style="margin-bottom: 10px;">
          <button class="secondary view-btn active" data-view="active">Active</button>
          <button class="secondary view-btn" data-view="archived">Archived</button>
        </div>
        <div class="row" id="status-filter" style="margin-bottom: 14px;">
          <button class="secondary filter-btn active" data-status="all">All</button>
          <button class="secondary filter-btn" data-status="new">New</button>
          <button class="secondary filter-btn" data-status="inprogress">In Progress</button>
          <button class="secondary filter-btn" data-status="blocked">Blocked</button>
          <button class="secondary filter-btn" data-status="closed">Completed</button>
        </div>
        <div id="tasks-container"></div>
      </section>
    </div>
  </main>
</div>

<div class="modal-backdrop hidden" id="add-task-modal-backdrop">
  <div class="modal">
    <div class="row between">
      <h2>Add Task</h2>
      <button class="secondary icon" id="add-task-close-btn">Close</button>
    </div>

    <div class="form-group">
      <label for="new-task-title">Title</label>
      <input type="text" id="new-task-title" placeholder="What needs to get done?">
    </div>

    <div class="form-group">
      <label for="new-task-due">Due Date</label>
      <input type="date" id="new-task-due">
    </div>

    <div class="form-group">
      <label for="new-task-recurrence">Repeat</label>
      <select id="new-task-recurrence">
        <option value="none">Does not repeat</option>
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
        <option value="monthly">Monthly</option>
      </select>
    </div>

    <div class="form-group hidden" id="new-task-weekdays">
      <label>Repeat on</label>
      <div class="row day-toggle-row"></div>
    </div>

    <div class="form-group hidden" id="new-task-monthdays">
      <label>Repeat on day(s) of month</label>
      <div class="row day-toggle-row day-toggle-grid"></div>
    </div>

    <div class="form-group">
      <label for="new-task-tags">Tags</label>
      <input type="text" id="new-task-tags" placeholder="e.g. urgent, client-x, followup">
    </div>

    <div class="form-group">
      <label for="new-task-note">Notes (optional)</label>
      <textarea id="new-task-note" placeholder="Add a note about where I left off..."></textarea>
    </div>

    <div class="row between" style="margin-top: 4px;">
      <span></span>
      <button id="create-task-btn">Create Task</button>
    </div>
  </div>
</div>

<div class="modal-backdrop hidden" id="task-modal-backdrop">
  <div class="modal">
    <div class="row between">
      <h2 id="modal-task-title"></h2>
      <button class="secondary icon" id="modal-close-btn">Close</button>
    </div>
    <div class="row" style="margin-bottom: 16px;">
      <select id="modal-status"></select>
      <label for="modal-due" style="font-size: 13px; color: var(--muted);">Due Date</label>
      <input type="date" id="modal-due">
      <label for="modal-recurrence" style="font-size: 13px; color: var(--muted);">Repeat</label>
      <select id="modal-recurrence">
        <option value="none">Does not repeat</option>
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
        <option value="monthly">Monthly</option>
      </select>
      <button class="secondary" id="modal-save-btn">Save</button>
      <span class="spacer"></span>
      <button class="secondary" id="modal-delete-btn" style="color: var(--danger); border-color: var(--danger);">Delete</button>
    </div>

    <div class="form-group hidden" id="modal-weekdays">
      <label>Repeat on</label>
      <div class="row day-toggle-row"></div>
    </div>

    <div class="form-group hidden" id="modal-monthdays">
      <label>Repeat on day(s) of month</label>
      <div class="row day-toggle-row day-toggle-grid"></div>
    </div>

    <div class="section-heading">Tags</div>
    <div class="tag-chips" id="modal-tag-chips"></div>
    <div class="row" style="margin-bottom: 16px;">
      <input type="text" id="modal-tag-input" placeholder="Type a tag, press Enter" list="tag-suggestions" style="flex: 1;">
      <datalist id="tag-suggestions"></datalist>
    </div>

    <div class="section-heading">Where I left off</div>
    <ul class="notes-timeline" id="modal-notes"></ul>
    <textarea id="modal-note-input" placeholder="Add a note about where you left off..."></textarea>
    <button id="modal-add-note-btn">Add Note</button>
  </div>
</div>

<script src="/static/status.js?v=3"></script>
<script src="/static/tasks.js?v=9"></script>
</body>
</html>
